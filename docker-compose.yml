version: '3.8'
services:
# 1. Backend AI (FastAPI + Uvicorn)
  backend-ai:
    build: ./apps/backend-ai
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend-ai:/app
    environment:
      - ROBOFLOW_API_KEY=your_key_here
# 2. Backend Core (Golang)
  backend-core:
    build: ./apps/backend-core
    ports:
      - "8080:8080"
    depends_on:
      - db
# 3. Frontend (Next.js)
  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
# 4. Database PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password